  i18n:
    en:
      name: TMS Finance
      description: >-
        A comprehensive personal finance management platform featuring
        multi-currency accounts, credit card statement and installment tracking,
        recurring expense projections, interactive peer-to-peer debt explorer,
        internal transfers, savings goals, batch payments, full WCAG 2.2 AA
        accessibility compliance, and an AI agent control plane with secure token
        management, execution visualizer, and audit logging via Model Context
        Protocol (MCP).
    pt:
      name: TMS Finance
      description: >-
        Uma plataforma completa de gestão financeira pessoal com contas
        multi-moeda, controle de faturas e parcelamento de cartão de crédito,
        projeção de despesas recorrentes, explorador interativo de empréstimos
        entre pessoas, transferências internas, metas de economia, pagamentos
        em lote, acessibilidade WCAG 2.2 AA e plano de controle para agentes de IA
        com gestão de tokens seguros, visualizador de execução e auditoria via
        Model Context Protocol (MCP).
